<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<title>Breeze 노트</title>
</head>
<body>
<div id="app" class="show-list">
  <aside id="sidebar">
    <div id="selBar" class="sel-bar" hidden>
      <button id="selAll" class="link">전체 선택</button>
      <b id="selCount">노트 선택</b>
      <button id="selDone" class="link">완료</button>
    </div>
    <header class="side-head">
      <h1 id="sideTitle">노트</h1>
      <button id="syncBtn" class="icon-btn sync-btn" title="동기화 설정"><span id="syncDot" class="dot off"></span>동기화</button>
      <button id="viewBtn" class="icon-btn" title="보기 옵션"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
      <button id="newBtn" class="icon-btn" title="새 노트 (⌘N)">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </button>
    </header>
    <input id="search" type="search" placeholder="검색" autocomplete="off">
    <div id="tags" hidden></div>
    <ul id="list"></ul>
    <div id="viewMenu" class="menu" hidden>
      <button data-view="list">목록으로 보기</button>
      <button data-view="gallery">갤러리로 보기</button>
      <hr>
      <button data-view="attachments">첨부 파일 보기</button>
    </div>
    <div id="selActions" class="sel-actions" hidden>
      <button data-sel="move">이동</button>
      <button data-sel="share">공유</button>
      <button data-sel="del" class="danger">삭제</button>
    </div>
    <footer class="side-foot">
      <button id="trashBtn" class="foot-btn">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
        <span id="trashLabel">휴지통</span><span id="trashCount" class="count"></span>
      </button>
      <span id="noteCount" class="note-count"></span>
      <button id="emptyTrashBtn" class="foot-btn danger" hidden>휴지통 비우기</button>
      <button id="composeBtn" class="icon-btn compose" title="새 노트"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
    </footer>
  </aside>

  <main id="editorPane" class="none">
    <header class="ed-head">
      <button id="backBtn" class="icon-btn back">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>노트
      </button>
      <button id="focusBtn" class="icon-btn wide-only" title="목록 숨기기/보이기"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
      <div class="trash-tools">
        <span class="hint">휴지통에 있는 노트</span>
        <button id="restoreBtn" class="pill">복구</button>
        <button id="purgeBtn" class="pill danger">영구 삭제</button>
      </div>
      <div class="tools">
        <button class="icon-btn fmt" data-cmd="check" title="체크리스트 (⌘⇧L)"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg></button>
        <button class="icon-btn fmt" data-cmd="list" title="글머리 목록"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="4.5" cy="18" r="1" fill="currentColor"/></svg></button>
        <button class="icon-btn fmt" data-cmd="file" title="파일 첨부"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m21 11-8.6 8.6a5 5 0 0 1-7-7l8.5-8.6a3.3 3.3 0 0 1 4.7 4.7l-8.6 8.6a1.7 1.7 0 0 1-2.3-2.4l7.9-7.9"/></svg></button>
        <button class="icon-btn fmt" data-cmd="photo" title="사진 넣기"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="3"/><circle cx="9" cy="11" r="2"/><path d="m21 17-5-5-9 8"/></svg></button>
        <button class="icon-btn fmt" data-cmd="heading" title="스타일"><b class="txt">Aa</b></button>
        <button class="icon-btn fmt" data-cmd="bold" title="굵게 (⌘B)"><b class="txt">B</b></button>
        <button class="icon-btn" data-cmd="pin" title="고정"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3Z"/></svg></button>
        <button class="icon-btn" data-cmd="del" title="삭제"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
      </div>
      <div class="hdr-right">
        <button id="findBtn" class="icon-btn" title="노트에서 찾기 (⌘F)"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button>
        <button id="readBtn" class="icon-btn read-btn" title="읽기 모드 (누르면 켜고 끔)"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5.5C4.5 4 8 4 12 6.5 16 4 19.5 4 22 5.5V19c-2.5-1.5-6-1.5-10 1-4-2.5-7.5-2.5-10-1Z"/><path d="M12 6.5V20"/></svg></button>
      </div>
    </header>
    <input type="file" id="photoInput" accept="image/*" multiple hidden>
    <input type="file" id="fileInput" multiple hidden>
    <div class="undo-float">
      <button class="icon-btn undo-btn" data-cmd="undo" title="되돌리기"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button class="icon-btn undo-btn" data-cmd="redo" title="다시 실행"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    </div>
    <div id="findBar" class="find-bar" hidden>
      <input id="findInput" type="search" placeholder="노트에서 찾기" autocomplete="off" enterkeyhint="search">
      <span id="findCount"></span>
      <button id="findPrev" class="icon-btn" title="이전 (⇧Enter)"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg></button>
      <button id="findNext" class="icon-btn" title="다음 (Enter)"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
      <button id="findClose" class="link">완료</button>
    </div>
    <div id="noteDate"></div>
    <div id="editor" contenteditable="false" spellcheck="false"></div>
    <nav class="ed-bar">
      <div class="grp edit-grp">
        <button class="icon-btn" data-cmd="check" title="체크리스트"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg></button>
        <button class="icon-btn" data-cmd="list" title="목록"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="4.5" cy="18" r="1" fill="currentColor"/></svg></button>
        <button class="icon-btn" data-cmd="heading" title="스타일"><b class="txt">Aa</b></button>
        <button class="icon-btn" data-cmd="bold" title="굵게"><b class="txt">B</b></button>
        <button class="icon-btn" data-cmd="photo" title="사진"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="3"/><circle cx="9" cy="11" r="2"/><path d="m21 17-5-5-9 8"/></svg></button>
        <button class="icon-btn" data-cmd="clip" title="클립보드 붙여넣기"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M9 10h6M9 14h6"/></svg></button>
        <button class="icon-btn" data-cmd="file" title="파일"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m21 11-8.6 8.6a5 5 0 0 1-7-7l8.5-8.6a3.3 3.3 0 0 1 4.7 4.7l-8.6 8.6a1.7 1.7 0 0 1-2.3-2.4l7.9-7.9"/></svg></button>
      </div>
      <div class="grp read-grp">
        <button class="icon-btn" data-cmd="del" title="삭제"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
        <button class="icon-btn" data-cmd="pin" title="고정"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3Z"/></svg></button>
      </div>
    </nav>
    <div id="empty">노트를 선택하거나 <button id="emptyNew" class="link">새 노트</button>를 만드세요</div>
  </main>
</div>

<div id="styleMenu" class="style-menu" hidden>
  <button data-style="title" class="st-title">제목</button>
  <button data-style="heading" class="st-heading">머리말</button>
  <button data-style="subheading" class="st-sub">부머리말</button>
  <button data-style="body">본문</button>
  <button data-style="mono" class="st-mono">고정폭</button>
  <div class="st-row">
    <button data-inline="bold" title="굵게 (⌘B)"><b>B</b></button>
    <button data-inline="italic" title="기울임 (⌘I)"><i>I</i></button>
    <button data-inline="underline" title="밑줄 (⌘U)"><u>U</u></button>
    <button data-inline="strikeThrough" title="취소선"><s>S</s></button>
  </div>
  <div class="st-row">
    <button data-list="ul" title="글머리 목록">• 목록</button>
    <button data-list="ol" title="번호 목록">1. 번호</button>
  </div>
</div>

<div id="toast" hidden><span id="toastMsg"></span><button id="toastBtn" class="link"></button></div>

<dialog id="tagSheet">
  <form method="dialog" class="sheet">
    <h2>태그로 옮기기</h2>
    <p class="hint">선택한 노트에 태그를 붙여 한곳에 모읍니다. 태그는 폴더처럼 목록 위에서 골라 볼 수 있어요.</p>
    <div id="tagChoices" class="tag-choices"></div>
    <label>태그<input id="newTag" placeholder="예: 설교" autocomplete="off"></label>
    <div class="row end"><button type="button" id="tagCancel">취소</button><button value="ok" class="primary">옮기기</button></div>
  </form>
</dialog>

<dialog id="settings">
  <form method="dialog" class="sheet">
    <h2>동기화</h2>
    <p class="hint">무료 Supabase 프로젝트 하나로 맥북과 갤럭시가 같은 노트를 공유합니다. 설정 방법은 README.md를 참고하세요.</p>
    <div id="cfgBox">
      <label>Project URL<input id="sbUrl" placeholder="https://xxxx.supabase.co" autocomplete="off"></label>
      <label>Publishable (anon) key<input id="sbKey" placeholder="sb_publishable_… 또는 eyJ…" autocomplete="off"></label>
    </div>
    <div id="authBox">
      <label>이메일<input id="email" type="email" autocomplete="username"></label>
      <label>비밀번호<input id="pw" type="password" autocomplete="current-password"></label>
      <div class="row"><button type="button" id="loginBtn" class="primary">로그인</button><button type="button" id="signupBtn">처음이면 가입</button></div>
    </div>
    <div id="userBox" hidden>
      <p>로그인됨: <b id="userEmail"></b></p>
      <p id="lastSync" class="hint"></p>
      <div class="row"><button type="button" id="syncNow" class="primary">지금 동기화</button><button type="button" id="logoutBtn">로그아웃</button></div>
    </div>
    <p id="authMsg" class="msg"></p>
    <hr>
    <div class="row"><button type="button" id="exportBtn">백업 내보내기</button><button type="button" id="importBtn">백업 가져오기</button><input type="file" id="importFile" accept=".json,application/json" hidden></div>
    <div class="row"><button type="button" id="appleBtn">애플 노트 가져오기</button><input type="file" id="appleDir" webkitdirectory hidden></div>
    <div class="row end"><span id="appVersion" class="hint version"></span><button value="close">닫기</button></div>
  </form>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
